<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
	<title>Thank You | Glocal LPO</title>

	<style>
		body {
			font-family: 'Poppins', sans-serif;
			background: #f8f9fa;
		}

		.thankyou-section {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 40px 20px;
		}

		.thankyou-card {
			background: #ffffff;
			padding: 50px 40px;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.08);
			max-width: 650px;
			width: 100%;
		}

		.thankyou-card h1 {
			font-weight: 600;
			margin-bottom: 20px;
		}

		.thankyou-card p {
			color: #555;
			font-size: 16px;
			margin-bottom: 30px;
		}

		.btn-home {
			display: inline-block;
			padding: 12px 28px;
			background-color: #0d6efd;
			color: #fff;
			border-radius: 6px;
			text-decoration: none;
			font-weight: 500;
			transition: 0.3s ease;
		}

		.btn-home:hover {
			background-color: #084298;
			color: #fff;
		}

		.check-icon {
			font-size: 60px;
			color: #28a745;
			margin-bottom: 20px;
		}
	</style>
</head>
<body>

<section class="thankyou-section">
	<div class="thankyou-card">
        <div class="align-items-center d-flex justify-content-center topbar">
		
            <a href="https://www.glocallpo.com/" target="_blank"><img src="images/lpologo.png" alt="logo"></a>
            
        </div>
    
		<h1>Thank You for Reaching Out!</h1>

		<p>
			We’ve received your inquiry successfully.  
			Our team will review your details and get back to you within 24 hours.
		</p>

		<p>
			Feel free to call us at  <a href="tel:+(456) 407-2122" class="1phone-btn" style="color: #333;">+1 (456) 407-2122</a>
			<!-- <strong>+1 (456) 407-2122</strong>. -->
		</p>


	</div>
</section>

<script src="js/bootstrap.min.js"></script>

</body>
</html>
